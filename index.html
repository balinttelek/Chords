<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Számkotta</title>
<meta name="description" content="Nashville számkották és setlistek színpadra">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Számkotta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column with a bottom tab bar; key tiles anchor every song row; the stage view is a separate black room that fits each chart as large as the phone allows. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E8E9E5; --ink:#17191C; --muted:#6E7176; --line:#DCDDD8;
  --accent:#2E8CA3; --accent-ink:#FFFFFF; --accent-soft:#DCEFF3; --danger:#C93A2B;
  --display:"Rubik","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;
  --body:"Figtree",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1C1D20; --sunk:#26282B; --ink:#F2F2EE; --muted:#9A9DA3; --line:#2E3034;
  --accent:#73C4D6; --accent-ink:#06222A; --accent-soft:#16323A; --danger:#FF6B5B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1C1D20; --sunk:#26282B; --ink:#F2F2EE; --muted:#9A9DA3; --line:#2E3034;
  --accent:#73C4D6; --accent-ink:#06222A; --accent-soft:#16323A; --danger:#FF6B5B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) 140px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px}
.link{color:var(--accent);font-weight:600;padding:8px 0;display:inline-flex;align-items:center;gap:4px}
.h1{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:36px;letter-spacing:-.5px;line-height:1.05;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px}
.search{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:10px 12px;margin-bottom:16px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:17px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:10px 14px 10px 10px;width:100%;text-align:left;min-height:60px;box-sizing:border-box}
.row:active{background:var(--sunk)}
.tile{flex:none;width:44px;height:44px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;font-stretch:100%;font-variant-numeric:tabular-nums}
.tile.empty{color:var(--muted);font-weight:600;font-size:15px}
.tile.num{background:var(--accent-soft);color:var(--accent)}
.row .main{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--muted);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);opacity:.7;flex:none}
.letter{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:16px 4px 6px}
.empty-state{background:var(--surface);border-radius:var(--r);color:var(--muted);text-align:center;padding:28px 16px;line-height:1.5}
.ic{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.ic:active{background:var(--sunk)}
.ic.del{color:var(--danger)}
.ic[disabled]{opacity:.25}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);-webkit-transform:translateZ(0);transform:translateZ(0);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px}
.tabs .tab{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);border-radius:10px}
.tabs .tab[aria-pressed="true"]{color:var(--accent)}
.fab{-webkit-transform:translateZ(0);transform:translateZ(0);position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(46,140,163,.30)}
.cta{-webkit-transform:translateZ(0);transform:translateZ(0);position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:21;max-width:608px;margin:0 auto;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;border-radius:16px;padding:16px;display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 8px 20px rgba(46,140,163,.28)}
.titlein{font-family:var(--display);font-stretch:112%;font-size:30px;font-weight:800;letter-spacing:-.4px;border:0;background:none;outline:none;width:100%;padding:0;margin:6px 0 2px}
.datein{border:0;background:none;color:var(--muted);font-size:16px;padding:0;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
/* small uppercase line above a title, like the setlist header */
.eyebrow{margin:12px 0 6px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow b{color:var(--accent);font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.4px;text-transform:none}
.h1.song{margin:0 0 20px}
.chip{background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.k{background:var(--ink);color:var(--bg);font-family:var(--display)}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:15px;margin:0 0 14px;line-height:1.4}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.field{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{width:96px;flex:none;color:var(--muted);font-size:15px}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;padding:2px 0}
.label{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:0 4px 8px}
textarea.chartin{display:block;width:100%;min-height:260px;border:0;background:var(--surface);border-radius:var(--r);padding:14px 16px;font-family:var(--display);font-size:19px;line-height:1.5;resize:vertical;outline:none;box-sizing:border-box}
.hint{color:var(--muted);font-size:13.5px;line-height:1.5;margin:10px 4px 22px}
.hint code{background:var(--sunk);border-radius:5px;padding:1px 5px;font-size:12.5px;color:var(--ink)}
.danger{color:var(--danger);font-weight:600;padding:14px 16px;width:100%;text-align:left}
.confirm{display:flex;gap:12px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.confirm .yes{background:var(--danger);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600}
.banner{background:var(--sunk);color:var(--muted);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;line-height:1.4}
.addrow{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:600;padding:14px;justify-content:center;border:1.5px dashed var(--line);border-radius:var(--r);width:100%}

/* chart */
.chart{display:inline-grid;grid-template-columns:1fr;font-family:var(--display);font-weight:700;font-stretch:100%;line-height:1.08;font-variant-numeric:tabular-nums}
.chart .sec{display:contents}
.chart .lbl{font-family:var(--body);font-weight:700;font-size:max(12px,.24em);color:var(--accent);line-height:1.2;padding-top:.55em;letter-spacing:.02em}
.chart .sec:first-child .lbl{padding-top:0}
.chart .lbl:empty{display:none}
.chart .rows{display:grid;grid-template-columns:repeat(var(--n),max-content);column-gap:.55em;row-gap:.02em}
.chart .t.first{grid-column-start:1}
.chart .t.mark{font-family:var(--body);font-weight:600;font-size:.42em;align-self:center;color:var(--muted)}
.chart .t.ltr{font-stretch:88%}
.chart .sl{font-size:.6em}
.chart .q{font-size:.6em;font-weight:600}
.chart.lbl-left{grid-template-columns:max-content max-content;column-gap:.35em;row-gap:.24em}
.chart.lbl-left .lbl{padding-top:.2em;max-width:7em;text-align:right;line-height:1.15}
.chart.lbl-left .lbl:empty{display:block}
.reading{background:var(--surface);border-radius:var(--r);padding:18px 16px;overflow-x:auto;margin-bottom:22px}
.reading .chart{font-size:34px}

/* stage */
.stage{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--sbg);color:var(--sfg);
  --sbg:#000;--sfg:#fff;--smuted:#8C8F94;--sacc:#73C4D6;--sbtn:rgba(255,255,255,.12);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.stage.light{--sbg:#fff;--sfg:#000;--smuted:#5E6166;--sacc:#227A90;--sbtn:rgba(0,0,0,.07)}
.stage .chart .lbl{color:var(--sacc)}
.stage .chart .t.mark{color:var(--smuted)}
.st-top{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 4px}
.st-top .info{flex:1;min-width:0;text-align:center;line-height:1.2}
.st-top .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.st-top .info span{color:var(--smuted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sbtn{min-width:44px;height:36px;padding:0 12px;border-radius:12px;background:var(--sbtn);color:var(--sfg);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display)}
.st-area{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-inline:8px}
.stage .sheet{z-index:41;color:var(--ink)}
.sbtn.slib{gap:6px;flex:none;max-width:none}
.stage .sheet-bg{z-index:40}.stage .ksheet{z-index:41;color:var(--ink)}
.sbtn.skey{background:var(--sacc);color:#04161b;min-width:48px;font-size:16px}
.sbar{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30;-webkit-transform:translateZ(0);transform:translateZ(0);pointer-events:none}
.st-zone{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.st-area{touch-action:none}
.st-card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:8px;background:var(--sbg);will-change:transform;transform-origin:50% 90%}
.st-card{z-index:1}
.st-card.back{z-index:0;visibility:hidden;transform:scale(.92);opacity:.45;border-radius:24px;box-shadow:0 0 0 1px var(--sbtn)}
.st-card.back.show{visibility:visible}
.st-card.moving{border-radius:24px;box-shadow:0 0 0 1px var(--sbtn),0 24px 60px rgba(0,0,0,.45)}
.st-card.enter{animation:cardIn .28s cubic-bezier(.2,.8,.2,1)}
.st-area.settling .st-card{opacity:0;animation:none}
/* entry: the stage rises in while the layout settles, then the chart pops in at its final size, so the wait reads as one motion */
.stage.opening{animation:stageIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes stageIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.st-area.reveal .st-card:not(.back){animation:chartIn .32s cubic-bezier(.2,.9,.25,1.15)}
@keyframes chartIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.stage.opening,.st-area.reveal .st-card:not(.back){animation:none}}
@keyframes cardIn{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.st-card.enter{animation:none}}
.st-zone.l{left:0}.st-zone.r{right:0}
.st-bot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 10px calc(8px + env(safe-area-inset-bottom,0px));color:var(--smuted);font-size:14px}
.st-bot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.st-bot .nx{color:var(--sfg);font-weight:600;display:flex;gap:.35em;justify-content:flex-end;flex:1;min-width:0;max-width:none}
.st-bot span:first-child{max-width:32%;flex:none}
.st-bot .nl,.st-bot .nk{flex:none;overflow:visible}
.st-bot .nx span{max-width:none}
.st-bot .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-bot .nk{color:var(--sacc);font-weight:800;font-size:16px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(48px + env(safe-area-inset-top,0px));background:var(--bg);border-radius:20px 20px 0 0;z-index:41;display:flex;flex-direction:column}
.sheet .shead{flex:none;padding:6px 16px 0;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box;border-bottom:1px solid var(--line)}
.sheet .shead .search{margin-bottom:12px}
.sheet .inner{flex:1;min-height:0;padding-top:12px!important;overflow-y:auto;padding-inline:16px;padding-block:6px 40px;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.cta.static{position:static;width:100%;margin-top:4px;box-sizing:border-box}
.cta[disabled]{opacity:.6}
.err{color:var(--danger);font-size:15px;margin:0 4px 14px}
.brand{display:block;border-radius:18px;margin:28px 0 10px}
.acct{color:var(--muted);font-size:14px;text-align:center;margin-top:28px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.acct button{color:var(--accent);font-weight:600}
.stage{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
html{background:var(--bg)}
.srow{position:relative;border-radius:var(--r);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .18s ease}
.srow.dragging{transition:none;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.2);overflow:visible}
.sbg{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:20px;font-weight:700;opacity:0;transition:opacity .12s}
.srow.swiping .sbg{opacity:.7}.srow.armed .sbg{opacity:1}
.sfront{position:relative;display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:10px 4px 10px 10px;min-height:60px;box-sizing:border-box;cursor:pointer}
.sfront .main{flex:1;min-width:0}
.grip{width:40px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;flex:none;cursor:grab}
.shint{color:var(--muted);font-size:13px;text-align:center;margin:12px 8px 0;line-height:1.4}
/* setlist as one grouped card: hairline rows, quiet numbers, the key chip tells set-only keys (filled) from the song's own (outlined) */
.list.grouped{gap:0;background:var(--surface);border-radius:16px}
.grouped .srow{border-radius:0}
.grouped .srow:first-child,.grouped .srow:first-child .sfront{border-radius:16px 16px 0 0}
.grouped .sfront{border-radius:0;min-height:64px;padding:8px 2px 8px 16px}
.grouped .srow+.srow .sfront{box-shadow:inset 0 1px 0 var(--line)}
.grouped .srow.dragging{border-radius:14px}.grouped .srow.dragging .sfront{border-radius:14px;box-shadow:none}
.grouped .addrow{border:0;border-top:1px solid var(--line);border-radius:0 0 16px 16px;justify-content:flex-start;padding:0 16px;height:56px;gap:14px}
.grouped+.shint{text-align:left;margin:12px 16px 0}
.snum{width:18px;flex:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.t2.orig{color:var(--accent);font-weight:600;font-size:13px}
.kchip{flex:none;min-width:48px;height:36px;padding:0 10px;border-radius:10px;box-sizing:border-box;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink)}
.kchip.over{box-shadow:none}
.kchip.empty{color:var(--muted);font-weight:600}
/* every list is one grouped card like the setlist */
.glist{display:grid;gap:0;background:var(--surface);border-radius:16px;overflow:hidden}
.glist>.row{border-radius:0;background:none;min-height:64px;padding:8px 14px 8px 16px}
.glist>.row+.row{box-shadow:inset 0 1px 0 var(--line)}
.glist>.row:active{background:var(--sunk)}
.glist .kchip{display:inline-grid;place-items:center}
.glist .check{margin-left:2px}
.dstack{flex:none;width:36px;display:flex;flex-direction:column;align-items:center;line-height:1}
.dstack b{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.dstack span{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.toast{display:flex;align-items:center;gap:14px}
.toast[hidden]{display:none}
.kbtn{border:0;cursor:pointer}
.kbtn.over{background:var(--accent);color:var(--accent-ink)}
.ksheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;padding:6px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;box-sizing:border-box}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kopt{height:58px;border-radius:14px;background:var(--surface);font-family:var(--display);font-weight:700;font-size:22px;position:relative}
.kopt.orig::after{content:"eredeti";position:absolute;left:0;right:0;bottom:4px;font-family:var(--body);font-size:10px;font-weight:600;color:var(--muted)}
.kopt.on{background:var(--accent);color:var(--accent-ink)}
.kopt.on.orig::after{color:inherit}
.kopt.base::after{content:"setlist";position:absolute;left:0;right:0;bottom:4px;font-family:var(--body);font-size:10px;font-weight:600;color:var(--muted)}
.kopt.on.base::after{color:inherit}
.kopt .cp{position:absolute;left:0;right:0;bottom:4px;font-family:var(--body);font-size:10px;font-weight:600;color:var(--muted)}
.kopt.on .cp{color:inherit}
.chart .kbig{grid-column:1/-1;font-size:max(1em,64px);line-height:1;margin-bottom:.22em;display:flex;align-items:baseline;gap:.25em}
.chart .klbl{font-family:var(--body);font-size:.26em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sacc,var(--accent))}
.chart .korig{font-family:var(--body);font-size:.22em;font-weight:600;color:var(--smuted,var(--muted));margin-left:.4em}
.imp{display:flex;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.impbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;border-radius:12px;padding:10px 14px;cursor:pointer}
.ocrmsg{background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.ocrmsg.bad{color:var(--danger)}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEYS=["C","C#","Db","D","Eb","E","F","F#","Gb","G","Ab","A","B","H"];
const ico={
  back:'<svg width="11" height="19" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  down:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 6 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m2 2 10 10M12 2 2 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  ok:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m2.5 7.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  image:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="2" fill="currentColor"/><path d="m21 16-5-5-9 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  paste:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  trash:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  grip:'<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  search:'<svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  list:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="6" r="1.4" fill="currentColor"/><circle cx="4" cy="12" r="1.4" fill="currentColor"/><circle cx="4" cy="18" r="1.4" fill="currentColor"/></svg>',
  note:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
};

/* ---------- state + sync ---------- */
const CFG=window.SZK_CONFIG||{}; const API=(CFG.supabaseUrl||"").replace(/\/$/,"");
const STORE="szk-store-v2", AUTH="szk-auth-v1", PREF="szamkotta-prefs-v1";
let store={songs:{},setlists:{},dirty:{},lastSync:0};
try{const s=JSON.parse(localStorage.getItem(STORE)||"null");if(s)store=Object.assign(store,s)}catch(e){}
let auth=null;try{auth=JSON.parse(localStorage.getItem(AUTH)||"null")}catch(e){}
const saveStore=()=>{try{localStorage.setItem(STORE,JSON.stringify(store))}catch(e){}};
const saveAuth=()=>{try{auth?localStorage.setItem(AUTH,JSON.stringify(auth)):localStorage.removeItem(AUTH)}catch(e){}};
let songs=new Map(), setlists=new Map();
const live=coll=>new Map(Object.entries(store[coll]).filter(([,r])=>!r.deleted).map(([k,r])=>[k,{...r.data,id:k}]));
function rebuild(){songs=live("songs");setlists=live("setlists")}
rebuild();
const ui={keyFor:null,ocr:null,view:"home",tab:"sets",q:"",id:null,draft:null,editSet:false,picker:false,pq:"",confirmDel:false,stage:null,login:{email:"",err:"",busy:false},confirmOut:false};
let prefs={letters:false,light:false};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREF)||"{}"))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(PREF,JSON.stringify(prefs))}catch(e){}};
let syncState="idle";

function put(coll,id,data){const {id:_,...d}=data;store[coll][id]={data:d,updated_at:new Date().toISOString(),deleted:false};store.dirty[coll+"/"+id]=1;saveStore();rebuild();scheduleSync()}
function del(coll,id){const r=store[coll][id];store[coll][id]={data:r?r.data:{},updated_at:new Date().toISOString(),deleted:true};store.dirty[coll+"/"+id]=1;saveStore();rebuild();scheduleSync()}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let tt;function toast(m,act){const t=$("#toast");t.innerHTML="";const s=document.createElement("span");s.textContent=m;t.appendChild(s);if(act){const b=document.createElement("button");b.type="button";b.className="tact";b.textContent=act.label;b.onclick=()=>{t.hidden=true;act.fn()};t.appendChild(b)}t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,act?5000:2600)}

function setSession(j){auth={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,user_id:j.user?j.user.id:auth.user_id,email:j.user?j.user.email:auth.email};saveAuth()}
async function authCall(grant,body){
  const r=await fetch(API+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:CFG.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||"auth");e.status=r.status;throw e} return j;
}
async function refresh(){
  try{setSession(await authCall("refresh_token",{refresh_token:auth.refresh_token}))}
  catch(e){if(e.status>=400&&e.status<500&&!Object.keys(store.dirty).length){auth=null;saveAuth();render()}throw e}
}
async function api(path,opts={}){
  if(!auth) throw new Error("auth");
  if(Date.now()>auth.expires_at-60000) await refresh();
  const call=()=>fetch(API+path,{...opts,headers:{apikey:CFG.supabaseKey,Authorization:"Bearer "+auth.access_token,"Content-Type":"application/json",...(opts.headers||{})}});
  let r=await call(); if(r.status===401){await refresh();r=await call()}
  if(!r.ok) throw new Error("http "+r.status); return r;
}
async function signIn(email,pw){setSession(await authCall("password",{email,password:pw}))}

let syncing=null,syncTimer;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(sync,700)}
async function seed(){
  try{const arr=await (await fetch("songs-seed.json")).json();const now=new Date().toISOString();
    for(const s of arr){const {id,...d}=s;store.songs[id]={data:{...d,updatedAt:Date.now()},updated_at:now,deleted:false};store.dirty["songs/"+id]=1}
    store.seeded=true;saveStore();rebuild();softRender();setTimeout(sync,100)}catch(e){}
}
function sync(){
  if(!auth||!API) return Promise.resolve();
  if(syncing) return syncing;
  if(!navigator.onLine){syncState="offline";paintStatus();return Promise.resolve()}
  syncState="syncing";paintStatus();
  syncing=(async()=>{
    try{
      for(const coll of ["songs","setlists"]){
        const ks=Object.keys(store.dirty).filter(k=>k.startsWith(coll+"/")); if(!ks.length) continue;
        const rows=ks.map(k=>{const id=k.slice(coll.length+1),r=store[coll][id];return {user_id:auth.user_id,id,data:r.data,updated_at:r.updated_at,deleted:!!r.deleted}});
        await api("/rest/v1/"+coll+"?on_conflict=user_id,id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
        for(const r of rows) if(store[coll][r.id]&&store[coll][r.id].updated_at===r.updated_at) delete store.dirty[coll+"/"+r.id];
      }
      let remoteSongs=0;
      for(const coll of ["songs","setlists"]){
        const rows=await (await api("/rest/v1/"+coll+"?select=id,data,updated_at,deleted")).json();
        if(coll==="songs") remoteSongs=rows.length;
        const seen=new Set();
        for(const r of rows){seen.add(r.id);if(store.dirty[coll+"/"+r.id]) continue;store[coll][r.id]={data:r.data,updated_at:r.updated_at,deleted:r.deleted}}
        for(const id of Object.keys(store[coll])) if(!seen.has(id)&&!store.dirty[coll+"/"+id]) delete store[coll][id];
      }
      store.lastSync=Date.now();saveStore();rebuild();syncState="idle";
      if(!remoteSongs&&!Object.keys(store.songs).length&&!store.seeded) seed();
      softRender();
    }catch(e){syncState=navigator.onLine?"error":"offline"}
    finally{syncing=null;paintStatus()}
  })();
  return syncing;
}
function softRender(){
  if(!auth||ui.view==="edit"||ui.view==="stage"||gest) return;
  const ae=document.activeElement&&document.activeElement.id;
  if(ui.view==="home"&&ae==="q"){$("#songList").innerHTML=songsList();return}
  if(ui.view==="set"&&(ui.picker||ui.keyFor||/^(s-name|s-date)$/.test(ae||""))){if(ui.picker&&$("#pickList"))$("#pickList").innerHTML=pickList(setlists.get(ui.id)||{});return}
  render();
}
function statusText(){
  const n=Object.keys(store.dirty).length, wait=n?" · "+n+" változás vár":"";
  if(syncState==="syncing") return "Szinkronizálás…";
  if(syncState==="offline"||!navigator.onLine) return "Offline"+(wait||" · minden dal megvan a telefonon");
  if(syncState==="error") return "Nem sikerült szinkronizálni"+wait;
  return store.lastSync?"Szinkronizálva "+new Date(store.lastSync).toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"})+wait:"";
}
function paintStatus(){const el=document.getElementById("syncStatus");if(el)el.textContent=statusText()}

/* ---------- chart parsing ---------- */
const RE_NUM=/^\(?(dur)?[b#]?[1-7]/;                       // Nashville number, maybe in brackets
const RE_LTR=/^\(?[A-H](#|b)?(m|maj|min|dim|aug|sus|add|\d|\/|[A-H]|#|b|\(|\)|\+|-|°)*\)?$/; // letter chord, kept as written
const RE_MARK=/^(\||%|x\d+|\d+x|-|…|\.\.\.|\/|:\|\||\|\|:)$/i;
const tokKind=t=>t==="."?"gap":RE_MARK.test(t)?"mark":RE_LTR.test(t)?"ltr":RE_NUM.test(t)?"num":"mark";
function parse(body){
  const secs=[];let cur=null;
  for(const raw of String(body||"").split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    const ci=line.indexOf(":");
    if(ci>0 && !/^[(\d\s|]/.test(line)){
      cur={label:line.slice(0,ci).trim(),rows:[]};secs.push(cur);
      const rest=line.slice(ci+1).trim(); if(rest) cur.rows.push(rest.split(/\s+/));
      continue;
    }
    const toks=line.split(/\s+/);
    if(!toks.some(t=>{const k=tokKind(t);return k==="num"||k==="ltr"})){cur={label:line,rows:[]};secs.push(cur);continue}
    if(!cur){cur={label:"",rows:[]};secs.push(cur)}
    cur.rows.push(toks);
  }
  return secs;
}
/* Hungarian naming: H = B natural, B = B flat */
const NAT={C:0,D:2,E:4,F:5,G:7,A:9,H:11,B:10};
const SH=["C","C#","D","D#","E","F","F#","G","G#","A","B","H"], FL=["C","Db","D","Eb","E","F","Gb","G","Ab","A","B","H"];
const DEG=[0,2,4,5,7,9,11];
function keyPc(k){if(!k)return null;const m=/^([A-H])([#b]?)/.exec(k);if(!m)return null;let p=NAT[m[1]];if(m[1]==="B"&&m[2]==="b")return 10;return (p+(m[2]==="#"?1:m[2]==="b"?-1:0)+12)%12}
/* capo = semitones to climb from the played (capo) key up to the written key */
function capoFor(orig,to){const o=keyPc(orig),t=keyPc(to);return o===null||t===null?null:(o-t+12)%12}
const flatKey=k=>/^(F|B|Bb|Eb|Ab|Db|Gb)$/.test(k||"");
function degName(acc,d,key){const pc=keyPc(key);const n=(pc+DEG[d-1]+(acc==="#"?1:acc==="b"?-1:0)+12)%12;return (acc==="b"||(acc!=="#"&&flatKey(key))?FL:SH)[n]}
function numToLetter(tok,key){
  const m=/^(dur)?([b#]?)([1-7])([^/]*)(?:\/([b#]?)([1-7]))?$/.exec(tok); if(!m||keyPc(key)===null) return null;
  let q=m[4]; const d=+m[3], dur=!!m[1];
  if(q.startsWith("-")) q="m"+q.slice(1);
  const hasQ=/^(m|maj|sus|dim|aug|°)/.test(q);
  if(!dur&&!m[2]&&!hasQ&&(d===2||d===3||d===6)) q="m"+q;
  if(!dur&&!m[2]&&!hasQ&&d===7) q="°"+q;
  let s=degName(m[2],d,key)+q; if(m[6]) s+="/"+degName(m[5],+m[6],key);
  return s;
}
function toLetter(tok,key){
  const m=/^(\(?)(.*?)(\)?)$/.exec(tok); const inner=m[2];
  const r=numToLetter(inner,key); return r?m[1]+r+m[3]:null;
}
function fmtNum(txt){
  // slash bass smaller, quality smaller: 4maj7 -> 4<q>maj7</q>
  const si=txt.indexOf("/"), main=si>0?txt.slice(0,si):txt, bass=si>0?txt.slice(si):"";
  const m=/^(\(?(?:dur)?[b#]?(?:[1-7]|[A-H](?:#|b)?))([^()]*)(.*)$/.exec(main);
  let h=m&&m[2]?esc(m[1])+'<span class="q">'+esc(m[2])+'</span>'+esc(m[3]):esc(main);
  return h+(bass?'<span class="sl">'+esc(bass)+'</span>':"");
}
/* letter chords move with a changed key; numbers never change */
function noteName(pc,key){return (flatKey(key)?FL:SH)[(pc%12+12)%12]}
function transposeLtr(tok,from,to){
  const f=keyPc(from),t=keyPc(to); if(f===null||t===null||f===t) return tok;
  const d=t-f, nm=(r,a)=>{let p=r==="B"&&a==="b"?10:NAT[r]+(a==="#"?1:a==="b"?-1:0);return noteName(p+d,to)};
  const m=/^(\(?)([A-H])(#|b)?(.*?)(?:\/([A-H])(#|b)?)?(\)?)$/.exec(tok); if(!m) return tok;
  return m[1]+nm(m[2],m[3])+m[4]+(m[5]?"/"+nm(m[5],m[6]):"")+m[7];
}
function cell(t,key,letters,to){
  const k=tokKind(t), shown=to||key;
  if(k==="gap") return {cls:"",html:""};
  if(k==="mark") return {cls:"mark",html:esc(t)};
  if(k==="ltr") return {cls:"ltr",html:fmtNum(to&&key?transposeLtr(t,key,to):t)};
  const txt=letters?(toLetter(t,shown)||t):t;
  return {cls:"",html:fmtNum(txt)};
}
/* the setlist key is the base the band plays in; a stage change on top of it is a capo shape */
function korig(key,ref,to){const base=ref||key;
  if(to===base) return 'eredeti: '+esc(key);
  const c=capoFor(base,to);return (base!==key?'setlist: ':'eredeti: ')+esc(base)+(c?' · capo '+c:'')}
const stageBase=(st,id)=>(st.base&&st.base[id])||(songs.get(id)||{}).key||"";
function chartHTML(body,key,letters,opt){
  opt=opt||{}; const to=opt.to&&opt.to!==key?opt.to:"";
  const secs=parse(body);
  if(!secs.length) return '<div class="empty-state">Még nincs kotta ehhez a dalhoz.</div>';
  const shown=to||key;
  const kb=opt.bigKey&&shown?'<div class="kbig"><span class="klbl">Key</span>'+esc(shown)+(to&&key?'<span class="korig">'+korig(key,opt.ref,to)+'</span>':'')+'</div>':'';
  return '<div class="chart">'+kb+secs.map(s=>{
    const n=Math.max(1,...s.rows.map(r=>r.length));
    const rows=s.rows.map(r=>r.map((t,i)=>{const c=cell(t,key,letters,to);return '<span class="t'+(i===0?" first":"")+(c.cls?" "+c.cls:"")+'">'+c.html+'</span>'}).join("")).join("");
    return '<div class="sec"><div class="lbl">'+esc(s.label)+'</div><div class="rows" style="--n:'+n+'">'+rows+'</div></div>';
  }).join("")+'</div>';
}

/* ---------- helpers ---------- */
const coll=new Intl.Collator("hu");
const sortedSongs=()=>[...songs.values()].sort((a,b)=>coll.compare(a.title||"",b.title||""));
const sortedSets=()=>[...setlists.values()].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
function nextSunday(){const d=new Date();d.setDate(d.getDate()+((7-d.getDay())%7));const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
const fmtDate=s=>{if(!s)return"";const d=new Date(s+"T12:00");return isNaN(d)?s:d.toLocaleDateString("hu-HU",{month:"long",day:"numeric",weekday:"long"})};
const songMeta=s=>[s.artist,s.bpm?s.bpm+" BPM":""].filter(Boolean).join(" · ");
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const setTile=(set,g)=>{const k=set.keys&&set.keys[g.id];return '<button class="kchip kbtn'+(k?" over":"")+((k||g.key)?"":" empty")+'" data-act="keyfor" data-id="'+g.id+'" aria-label="Hangnem módosítása">'+esc(k||g.key||"–")+'</button>'};
const chip=s=>'<span class="kchip'+(s.key?"":" empty")+'">'+esc(s.key||"–")+'</span>';
const tile=(s,cls)=>'<span class="tile'+(s.key?"":" empty")+(cls?" "+cls:"")+'">'+esc(s.key||"–")+'</span>';
const go=(view,extra)=>{Object.assign(ui,{view,confirmDel:false,editSet:false,picker:false,keyFor:null,stageKey:false,stageLib:false,ocr:null},extra||{});render();window.scrollTo(0,0)};

/* ---------- views ---------- */
function tabs(){
  return '<nav class="tabs"><button class="tab" data-act="tab" data-v="sets" aria-pressed="'+(ui.tab==="sets")+'">'+ico.list+'Setlistek</button><button class="tab" data-act="tab" data-v="songs" aria-pressed="'+(ui.tab==="songs")+'">'+ico.note+'Dalok</button></nav>'+
  '<button class="fab" data-act="new" aria-label="'+(ui.tab==="sets"?"Új setlist":"Új dal")+'">'+ico.plus+'</button>';
}
function vHome(){
  if(ui.tab==="sets") return '<div class="wrap"><div class="top"></div><h1 class="h1">Setlistek</h1><p class="sub" id="syncStatus">'+esc(statusText())+'</p>'+setsList()+acct()+'</div>'+tabs();
  return '<div class="wrap"><div class="top"></div><h1 class="h1">Dalok</h1><p class="sub">'+songs.size+' dal a daltárban</p>'+
  '<label class="search">'+ico.search+'<input id="q" type="search" placeholder="Cím vagy előadó" value="'+esc(ui.q)+'" autocomplete="off"></label><div id="songList">'+songsList()+'</div></div>'+tabs();
}
function acct(){
  if(!auth) return "";
  if(ui.confirmOut) return '<div class="acct">'+(Object.keys(store.dirty).length?'Van még nem szinkronizált változás. Várj, amíg felkerül.':'Kilépsz?')+' <button data-act="dologout">Kilépés</button> <button data-act="nologout">Mégse</button></div>';
  return '<div class="acct">'+esc(auth.email||"")+' · <button data-act="logout">Kilépés</button></div>';
}
function vLogin(){
  if(!API) return '<div class="wrap"><h1 class="h1">Számkotta</h1><div class="empty-state">Az app még nincs összekötve az adatbázissal.</div></div>';
  return '<div class="wrap"><img class="brand" src="icons/icon-180.png" alt="" width="72" height="72"><h1 class="h1">Számkotta</h1><p class="sub">Lépj be a fiókoddal. Ezután a dalok offline is elérhetők.</p>'+
  '<form id="loginForm" class="card"><div class="field"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="username" autocapitalize="off" required value="'+esc(ui.login.email)+'"></div><div class="field"><label for="l-pw">Jelszó</label><input id="l-pw" type="password" autocomplete="current-password" required></div></form>'+
  (ui.login.err?'<p class="err">'+esc(ui.login.err)+'</p>':'')+
  '<button class="cta static" form="loginForm" type="submit"'+(ui.login.busy?" disabled":"")+'>'+(ui.login.busy?"Belépés…":"Belépés")+'</button></div>';
}
function setsList(){
  const arr=sortedSets();

  const MON=["jan","feb","márc","ápr","máj","jún","júl","aug","szept","okt","nov","dec"];
  return '<div class="glist">'+arr.map(s=>{const n=(s.songIds||[]).filter(id=>songs.has(id)).length;
    const d=s.date?new Date(s.date+"T12:00"):null, ok=d&&!isNaN(d);
    return '<button class="row" data-act="openset" data-id="'+s.id+'"><span class="dstack"><b>'+(ok?d.getDate():"·")+'</b><span>'+(ok?MON[d.getMonth()]:"")+'</span></span><div class="main"><div class="t1">'+esc(s.name||"Névtelen setlist")+'</div><div class="t2">'+n+' dal</div></div><span class="chev">'+ico.chev+'</span></button>'}).join("")+'</div>';

function songsList(){

  if(!arr.length) return '<div class="empty-state">Nincs találat.</div>';

    const L=q?"":(norm(s.title)[0]||"#").toUpperCase();

function fit(){["stChart","stChartN","stChartP"].forEach(fitOne)}
function fitOne(cid){
  const area=$("#stArea"), ch=document.getElementById(cid); if(!area||!ch) return;
  const W=area.clientWidth-16, H=area.clientHeight-10; let best={f:0,m:"top"};
  for(const m of ["top","left"]){
    ch.className="chart lbl-"+m; let lo=10,hi=560;
    for(let k=0;k<14;k++){const mid=(lo+hi)/2;ch.style.fontSize=mid+"px";if(ch.offsetWidth<=W&&ch.offsetHeight<=H)lo=mid;else hi=mid}
    if(lo>best.f*1.04) best={f:lo,m};
  }
  ch.className="chart lbl-"+best.m; ch.style.fontSize=Math.floor(best.f)+"px";
}
let wake=null;
async function lockScreen(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
function releaseScreen(){try{wake&&wake.release()}catch(e){}wake=null}
/* card-style paging: the current card follows the finger, flies off, and the next one rises from behind */
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const hasSong=d=>{const st=ui.stage;return !!st&&st.i+d>=0&&st.i+d<st.list.length};
let flying=false;
function step(d){
  const st=ui.stage; if(!st||flying||!hasSong(d)) return;
  const card=$("#stCard");
  const go=()=>{flying=false;if(ui.stage!==st)return;st.i+=d;render()};
  const back=document.getElementById(d>0?"stNext":"stPrev");
  if(back&&!reduceMotion()){back.classList.add("show");back.style.transition="transform .22s ease-out, opacity .22s";back.style.transform="none";back.style.opacity="1"}
  if(!card||reduceMotion()){st.i+=d;render();return}
  flying=true;
  card.classList.add("moving");
  card.style.transition="transform .22s cubic-bezier(.4,0,.9,.6), opacity .22s";
  card.style.transform="translateX("+(d>0?-115:115)+"%) rotate("+(d>0?-9:9)+"deg)";
  card.style.opacity="0.3";
  setTimeout(go,210);
}
let cd=null;
document.addEventListener("pointerdown",e=>{
  if(ui.view!=="stage"||flying||ui.stageKey||ui.stageLib||e.clientX<24||!e.target.closest("#stArea")) return;
  cd={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId,on:false,dx:0};
});
document.addEventListener("pointermove",e=>{
  if(!cd||e.pointerId!==cd.id) return;
  const dx=e.clientX-cd.x, dy=e.clientY-cd.y, card=$("#stCard"); if(!card) return;
  if(!cd.on){ if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){cd.on=true;card.classList.add("moving");card.style.transition="none"} else return }
  cd.dx=dx; const eff=hasSong(dx<0?1:-1)?dx:dx*.25;
  card.style.transform="translateX("+eff+"px) rotate("+(eff/28)+"deg)";
  const show=document.getElementById(dx<0?"stNext":"stPrev"), hide=document.getElementById(dx<0?"stPrev":"stNext");
  if(hide) hide.classList.remove("show");
  if(show){const p=Math.min(1,Math.abs(eff)/($("#stArea").clientWidth||1));show.classList.add("show");show.style.transition="none";show.style.transform="scale("+(.92+.08*p)+")";show.style.opacity=String(.45+.55*p)}
});
function endCard(e){
  if(!cd||e.pointerId!==cd.id) return; const c=cd; cd=null; if(!c.on) return;
  quiet();
  const d=c.dx<0?1:-1, v=Math.abs(c.dx)/Math.max(1,performance.now()-c.t), card=$("#stCard");
  if((Math.abs(c.dx)>80||(v>.5&&Math.abs(c.dx)>40))&&hasSong(d)) return step(d);
  if(card){card.style.transition="transform .3s cubic-bezier(.2,.9,.3,1.2)";card.style.transform="";setTimeout(()=>{if(!cd){card.classList.remove("moving");card.style.transition=""}},300)}
  document.querySelectorAll(".st-card.back.show").forEach(b=>{b.style.transition="transform .3s, opacity .3s";b.style.transform="";b.style.opacity="";setTimeout(()=>{if(!cd)b.classList.remove("show")},300)});
}
document.addEventListener("pointerup",endCard);
document.addEventListener("pointercancel",endCard);
function startStage(list,i,keys,setId){$("#toast").hidden=true;ui.stage={list,i,keys:{...(keys||{})},base:{...(keys||{})},setId:setId||null,from:{view:ui.view,id:ui.id}};ui.view="stage";render();settleStage();lockScreen()}
/* on entry iOS still shifts the layout for a few frames (safe-area insets, fonts); keep the chart hidden until the area stops changing so it appears once, at its final size */
function settleStage(){
  const a=$("#stArea"); if(!a) return; a.classList.add("settling");
  const sg=$("#stage"); if(sg){sg.classList.add("opening");setTimeout(()=>sg.classList.remove("opening"),300)}
  const t0=performance.now(); let last="", same=0, fontsOk=!document.fonts||document.fonts.status==="loaded";
  if(!fontsOk&&document.fonts.ready) document.fonts.ready.then(()=>fontsOk=true);
  const tick=()=>{const el=$("#stArea"); if(!el||ui.view!=="stage") return;
    const s=el.clientWidth+"x"+el.clientHeight; same=s===last?same+1:0; last=s;
    const dt=performance.now()-t0;
    if((same>=3&&fontsOk&&dt>140)||dt>450){fit();el.classList.add("reveal");el.classList.remove("settling");setTimeout(()=>el.classList.remove("reveal"),360)}
    else requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}

/* ---------- render ---------- */
function render(){
  if(!auth){$("#app").innerHTML=vLogin();document.body.style.overflow="";return}
  const v=ui.view;
  $("#app").innerHTML=v==="song"?vSong():v==="edit"?vEdit():v==="set"?vSet():v==="stage"?vStage():vHome();
  document.body.style.overflow=(v==="stage"||ui.picker||ui.keyFor||ui.stageKey||ui.stageLib)?"hidden":"";
  /* iOS paints the strip under the home bar with the page background, not the stage's; match it so a dark stage stays black on a light-mode phone */
  {const sb=v==="stage"?(prefs.light?"#fff":"#000"):""; document.documentElement.style.background=sb; document.body.style.background=sb}
  if(v==="stage"){fit();requestAnimationFrame(fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);watchArea()}
  else if(areaRO) areaRO.disconnect();
}
/* iOS applies the safe-area insets a moment after the stage opens without firing "resize", so the chart was fitted to a too-tall area; refit whenever the area's real size changes */
let areaRO=null, areaSize="";
function watchArea(){
  const a=$("#stArea"); if(!a||!("ResizeObserver" in window)) return;
  if(!areaRO) areaRO=new ResizeObserver(()=>{const el=$("#stArea");if(!el)return;const s=el.clientWidth+"x"+el.clientHeight;if(s!==areaSize){areaSize=s;fit()}});
  areaRO.disconnect(); areaSize=a.clientWidth+"x"+a.clientHeight; areaRO.observe(a);
}
function readDraft(){const g=id=>$(id)?.value??"";Object.assign(ui.draft,{title:g("#f-title").trim(),artist:g("#f-artist").trim(),key:g("#f-key"),bpm:g("#f-bpm").replace(/\D/g,""),notes:g("#f-notes").trim(),body:g("#f-body")})}

document.addEventListener("click",e=>{
  if(suppressClick){suppressClick=false;e.preventDefault();return}
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const a=b.dataset.act, id=b.dataset.id, i=+b.dataset.i;
  const set=ui.view==="set"?setlists.get(ui.id):null;
  switch(a){
    case "tab": ui.tab=b.dataset.v; render(); window.scrollTo(0,0); break;
    case "home": case "back": history.back(); break;
    case "new":
      push(); if(ui.tab==="sets"){const nid=newId("l");const d=nextSunday();put("setlists",nid,{name:"Vasárnap, "+new Date(d+"T12:00").toLocaleDateString("hu-HU",{month:"long",day:"numeric"}),date:d,songIds:[],updatedAt:Date.now()});go("set",{id:nid})}
      else go("edit",{draft:{id:null,title:"",artist:"",key:"",bpm:"",notes:"",body:""}});
      break;
    case "opensong": ui.homeY=window.scrollY; push(); go("song",{id}); break;
    case "openset": ui.homeY=window.scrollY; push(); go("set",{id}); break;
    case "edit": push(); {const s=songs.get(ui.id);go("edit",{draft:{id:s.id,title:s.title||"",artist:s.artist||"",key:s.key||"",bpm:s.bpm||"",notes:s.notes||"",body:s.body||""}})} break;
    case "canceledit": history.back(); break;
    case "paste": (async()=>{try{const t=await navigator.clipboard.readText();if(!t.trim())throw 0;applyImport(t,"Beillesztve. Nézd át, és ha jó, nyomd meg a Mentést.")}catch(_){ui.ocr={msg:"Nem sikerült beilleszteni. Másold ki a jegyzet szövegét, és próbáld újra.",err:1};render()}})(); break;
    case "saveedit": {ui.ocr=null;readDraft();const d=ui.draft,isNew=!d.id,sid=d.id||newId("s");put("songs",sid,{title:d.title||"Névtelen dal",artist:d.artist,key:d.key,bpm:d.bpm,notes:d.notes,body:d.body,updatedAt:Date.now()});
      if(isNew){go("song",{id:sid})} else history.back()} break;
    case "askdel": ui.confirmDel=true; render(); break;
    case "nodel": ui.confirmDel=false; render(); break;
    case "dodelsong": del("songs",ui.draft.id); ui.tab="songs"; ignorePop=true; history.go(-2); goHome(); toast("Dal törölve"); break;
    case "dodelset": del("setlists",ui.id); ignorePop=true; history.back(); goHome(); toast("Setlist törölve"); break;
    case "toggleedit": ui.editSet=!ui.editSet; ui.confirmDel=false; render(); break;
    case "mv": case "rm": {const ids=(set.songIds||[]).filter(x=>songs.has(x));
      if(a==="rm") ids.splice(i,1); else {const j=i+(+b.dataset.d);[ids[i],ids[j]]=[ids[j],ids[i]]}
      put("setlists",set.id,{...set,songIds:ids,updatedAt:Date.now()});render()} break;
    case "picker": push(); ui.picker=true; ui.pq=""; render(); break;
    case "closepicker": history.back(); break;
    case "keyfor": push(); ui.keyFor=id; render(); break;
    case "closekey": history.back(); break;
    case "pickkey": {const g=songs.get(ui.keyFor),keys={...(set.keys||{})};
      if(!g||b.dataset.v===g.key) delete keys[ui.keyFor]; else keys[ui.keyFor]=b.dataset.v;
      put("setlists",set.id,{...set,keys,updatedAt:Date.now()}); history.back()} break;
    case "pick": {const ids=[...(set.songIds||[])].filter(x=>songs.has(x));const k=ids.indexOf(id);
      if(k>=0) ids.splice(k,1); else ids.push(id);
      put("setlists",set.id,{...set,songIds:ids,updatedAt:Date.now()});
      $("#pickList").innerHTML=pickList(setlists.get(set.id));
      {const q=$("#pq"); if(q&&q.value){q.focus();q.setSelectionRange(0,q.value.length)}}} break;
    case "playfrom": if(set){push();startStage((set.songIds||[]).filter(x=>songs.has(x)),i,set.keys||{},set.id)} break;
    case "playsong": push(); startStage([ui.id],0); break;
    case "exitstage": history.back(); break;
    case "stagekey": push(); ui.stageKey=true; render(); break;
    case "stagelib": push(); ui.stageLib=true; ui.lq=""; render(); setTimeout(()=>{const i=$("#lq");if(i)i.focus()},250); break;
    case "libpick": {const st=ui.stage; if(!st)break; let k=st.list.indexOf(id);
      if(k<0){k=st.i+1; st.list.splice(k,0,id);
        const sl=st.setId&&setlists.get(st.setId);
        if(sl){const ids=(sl.songIds||[]).filter(x=>songs.has(x)), cur=st.list[st.i], at=ids.indexOf(cur); ids.splice(at<0?ids.length:at+1,0,id); put("setlists",sl.id,{...sl,songIds:ids,updatedAt:Date.now()})}}
      st.i=k; st.enter=1; history.back()} break;
    case "stagepick": {const st=ui.stage; if(!st)break; const sid=st.list[st.i], s=songs.get(sid), v=b.dataset.v;
      if(s&&v===s.key&&!st.base[sid]) delete st.keys[sid]; else st.keys[sid]=v;
      history.back()} break;
    case "goback": history.back(); break;
    case "prev": step(-1); break;
    case "next": step(1); break;
    case "letters": prefs.letters=!prefs.letters; savePrefs(); render(); break;
    case "light": prefs.light=!prefs.light; savePrefs(); render(); break;
    case "logout": ui.confirmOut=true; render(); break;
    case "nologout": ui.confirmOut=false; render(); break;
    case "dologout": if(Object.keys(store.dirty).length){sync();break} auth=null;saveAuth();store={songs:{},setlists:{},dirty:{},lastSync:0};saveStore();rebuild();ui.confirmOut=false;go("home"); break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.q=t.value;$("#songList").innerHTML=songsList()}
  else if(t.id==="pq"){ui.pq=t.value;$("#pickList").innerHTML=pickList(setlists.get(ui.id))}

/* ---------- navigation: every screen and sheet is a history entry, so the iPhone back swipe works ---------- */
let ignorePop=false;
function push(){try{history.pushState({szk:1},"")}catch(_){}}
try{history.replaceState({szk:0},"")}catch(_){}
function goHome(){const y=ui.homeY||0;go("home");requestAnimationFrame(()=>window.scrollTo(0,y))}
function backAction(){
  if(ui.stageLib){ui.stageLib=false;render();return}
  if(ui.stageKey){ui.stageKey=false;render();return}
  if(ui.keyFor){ui.keyFor=null;render();return}
  if(ui.picker){ui.picker=false;render();return}
  if(ui.view==="stage"){const f=ui.stage?ui.stage.from:{view:"home"};releaseScreen();ui.stage=null;go(f.view,{id:f.id});return}
  if(ui.view==="edit"){ui.ocr=null;const id=ui.draft&&ui.draft.id;if(id&&songs.has(id))go("song",{id});else goHome();return}
  if(ui.view!=="home") goHome();
}
window.addEventListener("popstate",()=>{if(ignorePop){ignorePop=false;return}backAction()});
const canGoBack=()=>ui.view!=="home"||ui.picker||ui.keyFor||ui.stageKey||ui.stageLib;
/* fallback edge swipe, for when the system gesture is not available */
let edge=null;
document.addEventListener("touchstart",e=>{const t=e.touches[0];edge=(e.touches.length===1&&t.clientX<24&&canGoBack())?{x:t.clientX,y:t.clientY,dx:0,on:false}:null},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!edge) return; const t=e.touches[0], dx=t.clientX-edge.x, dy=t.clientY-edge.y;
  if(!edge.on){if(dx>12&&dx>Math.abs(dy)*1.5)edge.on=true;else if(Math.abs(dy)>12){edge=null;return}else return}
  e.preventDefault(); edge.dx=Math.max(0,dx); const a=$("#app"); a.style.transition="none"; a.style.transform="translateX("+edge.dx+"px)";
},{passive:false});
function endEdge(commit){
  if(!edge) return; const ed=edge; edge=null; if(!ed.on) return;
  const a=$("#app"); quiet();
  if(commit&&ed.dx>90){a.style.transition="transform .18s ease-out";a.style.transform="translateX(100%)";setTimeout(()=>{a.style.transition="";a.style.transform="";history.back()},170)}
  else{a.style.transition="transform .2s ease-out";a.style.transform="";setTimeout(()=>{a.style.transition=""},200)}
}
document.addEventListener("touchend",()=>endEdge(true));
document.addEventListener("touchcancel",()=>endEdge(false));

/* ---------- import: Notes text or a screenshot of it ---------- */
const KEYMAP={C:"C","C#":"C#",DB:"Db",D:"D","D#":"Eb",EB:"Eb",E:"E",F:"F","F#":"F#",GB:"Gb",G:"G","G#":"Ab",AB:"Ab",A:"A","A#":"B",BB:"B",B:"B",H:"H"};
function importText(text){
  const lines=String(text).replace(/\uFFFC/g,"").split(/\r?\n/).map(l=>l.replace(/[\t\u00A0]+/g," ").trim());
  let title="",key="",body=[],started=false;
  const ki=lines.findIndex(l=>/^keys?\s*:/i.test(l));
  if(ki>0){let j=ki-1;while(j>=0&&!lines[j])j--;if(j>=0){title=lines[j].replace(/:\s*$/,"");started=true;lines.splice(0,j+1)}}
  for(let l of lines){
    if(!started){ if((l.match(/[A-Za-zÀ-ž]/g)||[]).length>=3&&!/^keys?\s*:/i.test(l)){title=l.replace(/:\s*$/,"");started=true} continue }
    const km=/^keys?\s*:\s*([A-Ha-h])([#b]?)/i.exec(l);
    if(km&&!key){key=KEYMAP[(km[1].toUpperCase()+km[2]).toUpperCase()]||"";const rest=l.replace(/^keys?\s*:\s*\S+\s*/i,"");if(rest)body.push(rest);continue}
    if(!l) continue;
    l=l.replace(/:(?=\S)/,": ");
    const ci=l.indexOf(":"), head=ci>0?l.slice(0,ci+1):"", tail=ci>0?l.slice(ci+1):l;
    const toks=tail.trim().split(/\s+/).filter(Boolean).flatMap(t=>{
      if(/^[lI|]$/.test(t)) return ["1"];
      if(/^[1-7]{2,}$/.test(t)) return t.split("");
      return [t];
    });
    const chordish=toks.some(t=>/^\(?[b#]?[1-7]/.test(t));
    body.push(chordish||head?(head?head+" ":"")+toks.join(" "):l);
  }
  return {title,key,body:body.join("\n").trim()};
}
function applyImport(text,msg){
  const r=importText(text); if(!r.title&&!r.body){ui.ocr={msg:"Nem találtam szöveget a képen.",err:1};render();return}
  readDraft(); Object.assign(ui.draft,{title:r.title||ui.draft.title,key:r.key||ui.draft.key,body:r.body||ui.draft.body});
  ui.ocr={msg}; render();
}
let tessP=null;
function loadTess(){
  if(window.Tesseract) return Promise.resolve();
  return tessP||(tessP=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=ok;s.onerror=()=>{tessP=null;no(new Error("load"))};document.head.appendChild(s)}));
}
async function prepImage(file){
  const url=URL.createObjectURL(file); const img=new Image(); img.src=url; await img.decode();
  const sc=img.width<1400?2:1, c=document.createElement("canvas"); c.width=img.width*sc; c.height=img.height*sc;
  const x=c.getContext("2d"); x.filter="grayscale(1) contrast(1.15)"; x.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return c;
}
async function ocrFile(file){
  ui.ocr={msg:"Szöveg felismerése a képről… Az első alkalommal ez fél percig is eltarthat."}; readDraft(); render();
  try{
    await loadTess(); const canvas=await prepImage(file);
    const w=await Tesseract.createWorker("eng+hun");
    await w.setParameters({tessedit_pageseg_mode:"6"});
    const {data}=await w.recognize(canvas); await w.terminate();
    applyImport(data.text,"Kész. A felismerés nem tökéletes: nézd át a számokat, mielőtt mented.");
  }catch(e){ui.ocr={msg:navigator.onLine?"Nem sikerült feldolgozni a képet. Próbáld újra, vagy használd a Beillesztést.":"A képfelismeréshez internet kell.",err:1};render()}
}
document.addEventListener("change",e=>{if(e.target.id==="f-img"&&e.target.files[0]){ocrFile(e.target.files[0]);e.target.value=""}});

/* ---------- setlist gestures: swipe right to remove, drag the grip (or long-press) to reorder ---------- */
let gest=null, suppressClick=false;
const setIds=()=>{const s=setlists.get(ui.id);return s?(s.songIds||[]).filter(x=>songs.has(x)):[]};
function saveOrder(ids){const s=setlists.get(ui.id);if(s)put("setlists",s.id,{...s,songIds:ids,updatedAt:Date.now()})}
function quiet(){suppressClick=true;setTimeout(()=>suppressClick=false,400)}
function startDrag(){
  const g=gest; if(!g) return; clearTimeout(g.lp); g.mode="drag";
  g.rows=[...document.querySelectorAll(".srow")]; g.h=g.row.getBoundingClientRect().height+(parseFloat(getComputedStyle(g.row.parentNode).rowGap)||0); g.target=g.i;
  g.row.classList.add("dragging"); try{g.row.setPointerCapture(g.id)}catch(_){}
  if(navigator.vibrate) navigator.vibrate(10);
}
document.addEventListener("pointerdown",e=>{
  if(ui.view!=="set"||ui.picker||ui.keyFor||e.clientX<24||(e.button&&e.button>0)) return;
  const row=e.target.closest(".srow"); if(!row) return;
  gest={row,front:row.querySelector(".sfront"),i:+row.dataset.i,x0:e.clientX,y0:e.clientY,mode:null,id:e.pointerId,dx:0};
  if(e.target.closest(".grip")){startDrag();e.preventDefault();return}
  gest.lp=setTimeout(()=>{if(gest&&!gest.mode)startDrag()},450);
});
document.addEventListener("pointermove",e=>{
  const g=gest; if(!g||e.pointerId!==g.id) return;
  const dx=e.clientX-g.x0, dy=e.clientY-g.y0;
  if(g.mode==="drag"){
    g.row.style.transform="translateY("+dy+"px)";
    const t=Math.max(0,Math.min(g.rows.length-1,g.i+Math.round(dy/g.h)));
    if(t!==g.target){g.target=t;g.rows.forEach((r,k)=>{if(k===g.i)return;let s=0;if(g.i<t&&k>g.i&&k<=t)s=-g.h;if(g.i>t&&k<g.i&&k>=t)s=g.h;r.style.transform=s?"translateY("+s+"px)":""})}
    return;
  }
  if(!g.mode&&(Math.abs(dx)>8||Math.abs(dy)>8)){
    clearTimeout(g.lp);
    if(dx<0&&Math.abs(dx)>Math.abs(dy)*1.2){g.mode="swipe";g.row.classList.add("swiping")}else{gest=null;quiet();return}
  }
  if(g.mode==="swipe"){g.dx=Math.max(0,-dx);g.front.style.transform="translateX("+(-g.dx)+"px)";g.row.classList.toggle("armed",g.dx>g.row.offsetWidth*.35)}
});
function endGesture(e,cancel){
  const g=gest; if(!g||e.pointerId!==g.id) return; clearTimeout(g.lp); gest=null;
  if(g.mode==="drag"){
    quiet(); g.rows.forEach(r=>r.style.transform=""); g.row.classList.remove("dragging");
    if(!cancel&&g.target!==g.i){const ids=setIds();const [m]=ids.splice(g.i,1);ids.splice(g.target,0,m);saveOrder(ids)}
    render(); return;
  }
  if(g.mode==="swipe"){
    quiet();
    if(!cancel&&g.dx>g.row.offsetWidth*.35){
      g.front.style.transition="transform .18s ease-out";g.front.style.transform="translateX(-110%)";
      setTimeout(()=>{const ids=setIds(),prev=ids.slice(),[gone]=ids.splice(g.i,1);saveOrder(ids);render();
        const s=songs.get(gone);toast((s?s.title:"Dal")+" kivéve",{label:"Visszavonás",fn:()=>{saveOrder(prev);render()}})},170);
    }else{
      g.front.style.transition="transform .2s ease-out";g.front.style.transform="";g.row.classList.remove("swiping","armed");
      setTimeout(()=>{g.front.style.transition=""},220);
    }
  }
}
document.addEventListener("pointerup",e=>endGesture(e,false));
document.addEventListener("pointercancel",e=>endGesture(e,true));
document.addEventListener("touchmove",e=>{if(gest&&gest.mode)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".srow"))e.preventDefault()});

  catch(err){ui.login.busy=false;
    ui.login.err=/fetch|network/i.test(err.message)?"Nincs internet. A belépéshez kell net.":/invalid/i.test(err.message)?"Hibás e-mail vagy jelszó.":err.message;render()}

if("serviceWorker" in navigator) window.addEventListener("load",()=>{
  const hadSW=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW)showUpdate()});
  navigator.serviceWorker.register("sw.js").then(r=>{document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update().catch(()=>{})})}).catch(()=>{});

function showUpdate(){
  if(document.getElementById("upd")) return;
  const b=document.createElement("button");b.id="upd";b.className="upd";b.type="button";
  b.textContent="Új verzió érhető el. Koppints a frissítéshez.";
