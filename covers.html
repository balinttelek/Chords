<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chords borítók</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Review page, not part of the app: fetches album art from the Apple search on this phone and shows three ways the setlist and song library could use it. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E8E9E5; --ink:#17191C; --muted:#6E7176; --line:#DCDDD8;
  --accent:#2E8CA3; --accent-ink:#FFFFFF; --accent-soft:#DCEFF3;
  --display:"Rubik","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;
  --body:"Figtree",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121315; --surface:#1C1D20; --sunk:#26282B; --ink:#F2F2EE; --muted:#9A9DA3; --line:#2E3034;
  --accent:#73C4D6; --accent-ink:#06222A; --accent-soft:#16323A; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.eyebrow{margin:6px 0 4px;color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
h1{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.5px;line-height:1.1}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 16px;line-height:1.4}
.seg{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:12px;margin:0 0 18px;position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:5}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.h2{font-family:var(--display);font-weight:700;font-size:19px;margin:26px 2px 10px}
.note{color:var(--muted);font-size:14px;line-height:1.45;margin:-4px 2px 12px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:4px 0 16px}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.cov{flex:none;background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-weight:800;overflow:hidden}
.kchip{flex:none;min-width:44px;height:34px;padding:0 9px;border-radius:10px;display:inline-grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--display);font-weight:800;font-size:16px}
.kchip.over{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.t1{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--muted);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0}
.card{background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 12px;min-height:64px}
.row+.row{box-shadow:inset 0 1px 0 var(--line)}
.grip{flex:none;color:var(--muted);opacity:.6;width:18px;height:12px}
.snum{width:16px;flex:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:14px}
/* review grid */
.rev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rev .it{display:flex;flex-direction:column;gap:6px;text-align:left}
.rev .cov{width:100%;aspect-ratio:1;border-radius:12px;font-size:28px}
.rev .t1{font-size:13.5px}.rev .t2{font-size:12px}
.rev .alt{font-size:11.5px;color:var(--accent);font-weight:700}
.miss{opacity:.55}
/* A */
.a .cov{width:46px;height:46px;border-radius:10px;font-size:18px}
/* B */
.b .row{min-height:84px;gap:14px;padding:10px 12px}
.b .cov{width:64px;height:64px;border-radius:12px;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.b .t1{font-size:17.5px}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bgrid .it{display:flex;flex-direction:column;gap:7px}
.bgrid .cw{position:relative}
.bgrid .cov{width:100%;aspect-ratio:1;border-radius:14px;font-size:34px}
.bgrid .kb{position:absolute;right:8px;bottom:8px;min-width:36px;height:30px;padding:0 8px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* C */
.c .row{position:relative;min-height:76px;overflow:hidden;isolation:isolate}
.c .row .wash{position:absolute;inset:-30px;background:center/cover no-repeat;filter:blur(26px) saturate(1.4);opacity:.32;z-index:-1}
.c .cov{width:52px;height:52px;border-radius:26px;font-size:18px;box-shadow:0 0 0 2px var(--surface)}
.sets{display:grid;gap:12px}
.mos{flex:none;width:58px;height:58px;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--line)}
.mos span{background:var(--sunk) center/cover no-repeat}
.letter{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.8px;margin:14px 4px 6px}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Csak előnézet · az app nem változik</p>
  <h1>Borítók és tervek</h1>
  <p class="sub" id="status">Borítók keresése…</p>
  <div class="bar"><i id="prog"></i></div>
  <div class="seg" role="tablist">
    <button data-tab="rev" aria-pressed="true">Borítók</button>
    <button data-tab="a" aria-pressed="false">A terv</button>
    <button data-tab="b" aria-pressed="false">B terv</button>
    <button data-tab="c" aria-pressed="false">C terv</button>
  </div>
  <div id="view"></div>
</div>
<script>
/* title, search words (title + artist), key. null search = no known recording, leave without cover */
const SONGS=[
["Agnus Dei","Agnus Dei Michael W. Smith","A"],["Anthem planetshakers","Anthem Planetshakers Limitless","D"],["Áraszd ránk",null,"G"],
["Arms open wide","Arms Open Wide Hillsong UNITED","D"],["At the cross (Keresztednél)","At the Cross Hillsong Worship","D"],["Awesome God","Awesome God Rich Mullins","A"],
["Azért élek Uram",null,"A"],["Beautiful exchange","Beautiful Exchange Hillsong Worship","D"],["Bemegyek a szentek szentjébe",null,"G"],
["Echoes","Echoes Til Nothing Remains Elevation Worship","C"],["Egy hangon",null,"G"],["Fathers house","Fathers House Cory Asbury","G"],
["For who you are","For Who You Are Hillsong Worship","H"],["Forever","Forever Kari Jobe","A"],["From the inside out","From the Inside Out Hillsong UNITED","A"],
["Glorious Ruins","Glorious Ruins Hillsong","G"],["Go","Go Hillsong","E"],["Good Grace","Good Grace Hillsong UNITED","G"],
["Goodness of God","Goodness of God Bethel Music","A"],["Heart of worship","Heart of Worship Matt Redman","D"],["Here again","Here Again Elevation Worship","G"],
["Here i am to worship","Here I Am to Worship Tim Hughes","E"],["Holy forever","Holy Forever Chris Tomlin","C"],["Hosanna","Hosanna Hillsong UNITED","E"],
["Hova mennék","Hova mennék Ararat Worship","C"],["How great is our God","How Great Is Our God Chris Tomlin","G"],["I thank God","I Thank God Maverick City Music","A"],
["Irgalma éltet (Mercy)","Mercy Elevation Worship","A"],["It is well","It Is Well Bethel Music","A"],["King of my heart","King of My Heart Bethel Music","A"],
["Légy tűz / What a beautiful name","What a Beautiful Name Hillsong Worship","D"],["Like an avalanche","Like an Avalanche Hillsong UNITED","E"],["Like incense","Like Incense Sometimes by Step Hillsong","G"],
["Lord send revival","Lord Send Revival Hillsong Young Free","C"],["Magnificent","Magnificent Hillsong","A"],["Mercy Jam",null,"A"],
["Mily nagy Istenünk","How Great Is Our God Chris Tomlin","G"],["Minden javamra lesz",null,"D"],["More love more power","More Love More Power Michael W. Smith","E"],
["More than life","More Than Life Hillsong UNITED","D"],["No longer slaves","No Longer Slaves Bethel Music","H"],["O praise the name","O Praise the Name Anastasis Hillsong Worship","D"],
["One way","One Way Hillsong UNITED","E"],["Open heaven","Open Heaven River Wild Hillsong","A"],["Promises (Ígéretek)","Promises Maverick City Music","G"],
["Real love","Real Love Hillsong Young Free","A"],["Reckless love","Reckless Love Cory Asbury","C"],["Relentless remix","Relentless Hillsong UNITED Madison Square Garden","D"],
["Revelation song","Revelation Song Kari Jobe","D"],["Shout to the Lord","Shout to the Lord Hillsong","H"],["Soha nem leszek tobbe",null,"H"],
["Still","Still Hillsong Worship","A"],["The stand / B. E.","The Stand Hillsong UNITED","A"],["This i believe","This I Believe The Creed Hillsong Worship","D"],
["This is living","This Is Living Hillsong Young Free","A"],["This is our God","This Is Our God Hillsong","A"],["Through it all","Through It All Hillsong","G"],
["Touch of heaven","Touch of Heaven Hillsong Worship","C"],["Trust in God","Trust in God Elevation Worship","G"],["Uram tehozzad futok",null,"E"],
["Vt himnusz",null,"C"],["Waiting here for You","Waiting Here for You Passion Christy Nockels","A"],["We fall down","We Fall Down Chris Tomlin","D"],
["Who you say i am","Who You Say I Am Hillsong Worship","G"],["Whole heart","Whole Heart Hold Me Now Hillsong UNITED","A"],["With everything","With Everything Hillsong UNITED","A"],
["Worthy of it all","Worthy of It All David Brymer","D"],["Worthy","Worthy Elevation Worship","E"],["Yeshua","Yeshua Jesus Image","D"],["Your name high","Your Name High Influence Music","E"]
];
const CK="chords-covers-v1";
let store={};try{store=JSON.parse(localStorage.getItem(CK)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(CK,JSON.stringify(store))}catch(e){}};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const art=u=>u?u.replace(/\/\d+x\d+bb\./,"/600x600bb."):"";
let tab="rev";

/* Apple search, via JSONP so it works without CORS headers */
function search(term){return new Promise((ok,no)=>{const cb="cb"+Math.random().toString(36).slice(2);const s=document.createElement("script");
  const t=setTimeout(()=>{cleanup();no(new Error("timeout"))},12000);
  function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
  window[cb]=d=>{cleanup();ok(d.results||[])};s.onerror=()=>{cleanup();no(new Error("load"))};
  s.src="https://itunes.apple.com/search?entity=song&limit=6&country=us&term="+encodeURIComponent(term)+"&callback="+cb;document.head.appendChild(s)})}
/* prefer the result whose song title starts like ours */
function rank(title,res){const q=norm(title.replace(/\(.*?\)/g,"").split("/").pop());return res.slice().sort((a,b)=>{
  const sa=norm(a.trackName).startsWith(q.split(" ").slice(0,2).join(" "))?0:1, sb=norm(b.trackName).startsWith(q.split(" ").slice(0,2).join(" "))?0:1; return sa-sb})}
async function fetchAll(){
  const todo=SONGS.filter(s=>s[1]&&!store[s[0]]);let done=SONGS.length-todo.length;
  const st=document.getElementById("status"),pr=document.getElementById("prog");
  const upd=()=>{pr.style.width=Math.round(done/SONGS.length*100)+"%";st.textContent=done<SONGS.length?`Borítók keresése… ${done}/${SONGS.length}`:found()}
  upd();
  for(const s of todo){
    let tries=0;
    while(tries<3){try{const r=rank(s[0],await search(s[1]));store[s[0]]={res:r.slice(0,5).map(x=>({t:x.trackName,a:x.artistName,al:x.collectionName,img:art(x.artworkUrl100)})),pick:0};save();break}
      catch(e){tries++;await new Promise(r=>setTimeout(r,4000*tries))}}
    done++;upd();render();await new Promise(r=>setTimeout(r,450));
  }
  upd();
}
function found(){const n=SONGS.filter(s=>cov(s[0])).length;return `${n} dalhoz van borító, ${SONGS.length-n} dalhoz nincs. Ha egy borító rossz, koppints rá, és jön a következő találat.`}
const pickOf=t=>{const e=store[t];return e&&e.res&&e.res[e.pick||0]};
const cov=t=>{const p=pickOf(t);return p&&p.img};
const artist=t=>{const p=pickOf(t);return p?p.a:""};
const covEl=(t,cls)=>{const u=cov(t);return '<span class="cov'+(cls?" "+cls:"")+'" style="'+(u?"background-image:url(\'"+esc(u)+"\')":"")+'">'+(u?"":esc((t[0]||"").toUpperCase()))+'</span>'};
const grip='<svg class="grip" viewBox="0 0 18 12" aria-hidden="true"><path d="M1 1h16M1 6h16M1 11h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const SET=["Agnus Dei","At the cross (Keresztednél)","Beautiful exchange","Hova mennék","Goodness of God"];
const SETKEY={"At the cross (Keresztednél)":"E"};
const LIB=SONGS.slice(0,12).map(s=>s[0]);
const keyOf=t=>(SONGS.find(s=>s[0]===t)||[])[2]||"";
const setlistsDemo=[["Vasárnap, október 11.",SET],["Ifi alkalom, október 17.",["Reckless love","Echoes","Hosanna","Who you say i am"]]];

function vRev(){
  return '<div class="rev">'+SONGS.map(s=>{const e=store[s[0]],p=pickOf(s[0]),n=e&&e.res?e.res.length:0;
    return '<button class="it'+(p?"":" miss")+'" data-t="'+esc(s[0])+'">'+covEl(s[0])+'<span class="t1">'+esc(s[0])+'</span><span class="t2">'+(p?esc(p.a):(s[1]?(e?"nincs találat":"keresés…"):"nincs felvétel"))+'</span>'+(n>1?'<span class="alt">'+((e.pick||0)+1)+'/'+n+' találat</span>':'')+'</button>'}).join("")+'</div>';
}
function setRows(list,fn){return '<div class="card">'+list.map((t,i)=>fn(t,i)).join("")+'</div>'}
function kchip(t){const o=SETKEY[t];return '<span class="kchip'+(o?" over":"")+'">'+esc(o||keyOf(t))+'</span>'}
function meta(t){return SETKEY[t]?'<div class="t2" style="color:var(--accent);font-weight:600">eredeti: '+esc(keyOf(t))+'</div>':(artist(t)?'<div class="t2">'+esc(artist(t))+'</div>':'')}
function letters(list,fn){let out="",L="";for(const t of list){const l=norm(t)[0].toUpperCase();if(l!==L){out+=(out?'</div>':'')+'<div class="letter">'+l+'</div><div class="card">';L=l}out+=fn(t)}return out+'</div>'}
function vA(){
  return '<p class="note">A legkisebb lépés: a sorszám helyére egy kis borító kerül, alatta az előadó. Minden más marad.</p>'+
  '<div class="h2">Setlist</div><div class="a">'+setRows(SET,(t,i)=>'<div class="row">'+covEl(t)+'<div class="main"><div class="t1">'+esc(t)+'</div>'+meta(t)+'</div>'+kchip(t)+grip+'</div>')+'</div>'+
  '<div class="h2">Daltár</div><div class="a">'+letters(LIB,t=>'<div class="row">'+covEl(t)+'<div class="main"><div class="t1">'+esc(t)+'</div>'+(artist(t)?'<div class="t2">'+esc(artist(t))+'</div>':'')+'</div><span class="kchip">'+esc(keyOf(t))+'</span></div>')+'</div>';
}
function vB(){
  return '<p class="note">A borító a főszereplő: nagyobb sorok a setlistben, rácsos daltár, a hangnem a borító sarkában.</p>'+
  '<div class="h2">Setlistek</div><div class="sets">'+setlistsDemo.map(([n,l])=>'<div class="card"><div class="row" style="min-height:82px"><span class="mos">'+l.slice(0,4).map(t=>'<span style="'+(cov(t)?"background-image:url(\'"+esc(cov(t))+"\')":"")+'"></span>').join("")+'</span><div class="main"><div class="t1" style="font-size:17.5px">'+esc(n)+'</div><div class="t2">'+l.length+' dal</div></div></div></div>').join("")+'</div>'+
  '<div class="h2">Setlist</div><div class="b">'+setRows(SET,(t,i)=>'<div class="row">'+covEl(t)+'<div class="main"><div class="t1">'+esc(t)+'</div>'+meta(t)+'</div>'+kchip(t)+grip+'</div>')+'</div>'+
  '<div class="h2">Daltár</div><div class="bgrid">'+LIB.map(t=>'<div class="it"><div class="cw">'+covEl(t)+'<span class="kb">'+esc(keyOf(t))+'</span></div><div><div class="t1" style="font-size:15px">'+esc(t)+'</div>'+(artist(t)?'<div class="t2">'+esc(artist(t))+'</div>':'')+'</div></div>').join("")+'</div>';
}
function vC(){
  return '<p class="note">Hangulat: a borító színei halványan átszínezik a sort, a borító kerek, mint egy lemez.</p>'+
  '<div class="h2">Setlist</div><div class="c">'+setRows(SET,(t,i)=>'<div class="row">'+(cov(t)?'<span class="wash" style="background-image:url(\''+esc(cov(t))+'\')"></span>':'')+'<span class="snum">'+(i+1)+'</span>'+covEl(t)+'<div class="main"><div class="t1">'+esc(t)+'</div>'+meta(t)+'</div>'+kchip(t)+grip+'</div>')+'</div>'+
  '<div class="h2">Daltár</div><div class="c">'+letters(LIB,t=>'<div class="row">'+(cov(t)?'<span class="wash" style="background-image:url(\''+esc(cov(t))+'\')"></span>':'')+covEl(t)+'<div class="main"><div class="t1">'+esc(t)+'</div>'+(artist(t)?'<div class="t2">'+esc(artist(t))+'</div>':'')+'</div><span class="kchip">'+esc(keyOf(t))+'</span></div>')+'</div>';
}
function render(){const y=window.scrollY;document.getElementById("view").innerHTML=tab==="rev"?vRev():tab==="a"?vA():tab==="b"?vB():vC();window.scrollTo(0,y)}
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-pressed",String(b===tb)));render();window.scrollTo(0,0);return}
  const it=e.target.closest(".rev .it");if(it){const en=store[it.dataset.t];if(en&&en.res&&en.res.length>1){en.pick=((en.pick||0)+1)%en.res.length;save();render()}}
});
render();fetchAll();
</script>
</body>
</html>
